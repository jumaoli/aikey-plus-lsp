name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 准备 Android SDK
        uses: android-actions/setup-android@v3

      - name: 确认构建工具
        shell: pwsh
        run: |
          Write-Host "ANDROID_HOME=$env:ANDROID_HOME"
          Get-ChildItem "$env:ANDROID_HOME\build-tools" -Directory | Select-Object -ExpandProperty Name
          Get-ChildItem "$env:ANDROID_HOME\platforms" -Directory | Select-Object -ExpandProperty Name

      - name: 还原签名（可选）
        shell: pwsh
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if ($env:KEYSTORE_BASE64) {
            $path = Join-Path $env:RUNNER_TEMP 'aikey.jks'
            [System.IO.File]::WriteAllBytes($path, [Convert]::FromBase64String($env:KEYSTORE_BASE64))
            "KEYSTORE_PATH=$path" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "使用仓库密钥签名"
          } else {
            Write-Host "未配置 KEYSTORE_BASE64，使用 CI 临时签名（与正式版签名不同，不能覆盖安装）"
          }

      - name: 构建
        shell: pwsh
        run: |
          if ($env:KEYSTORE_PATH) {
            ./build.ps1 -KeystorePath $env:KEYSTORE_PATH -StorePass $env:KEYSTORE_PASS
          } else {
            ./build.ps1
          }
        env:
          KEYSTORE_PASS: ${{ secrets.KEYSTORE_PASS }}

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: aikey-apk
          path: |
            dist/*.apk
          if-no-files-found: error

      - name: 发布 Release（仅打 tag 时）
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $apk = Get-ChildItem dist/*.apk | Select-Object -First 1
          $notes = "由 GitHub Actions 自动构建（$tag）。`n`n> 如果本次没有配置 KEYSTORE_BASE64，此包使用 CI 临时签名，无法覆盖安装正式版。"
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $apk.FullName --clobber
          } else {
            gh release create $tag $apk.FullName --title "$tag" --notes $notes
          }
